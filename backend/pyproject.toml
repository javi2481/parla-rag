[project]
name = "parla-rag-api"
version = "0.1.0"
description = "Parla RAG: wizard de documentos con LlamaCloud (Parse, Split, Classify, Schema, Extract) y bibliotecas con LlamaIndex, Voyage AI y OpenAI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "regex>=2024.9",
  "pydantic-settings>=2.4",
  "llama-cloud>=2.8",
  "llama-index-core>=0.14.26",
  "llama-index-embeddings-voyageai>=0.8.0",
  "llama-index-postprocessor-voyageai-rerank>=0.7.0",
  "llama-index-llms-openai>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Ruff no revisa la carpeta-DB: ahí están las notebooks de las clases, que son material de ejemplo, no código del proyecto.
[tool.ruff]
extend-exclude = ["data"]
