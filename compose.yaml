services:
  app:
    build: .
    image: parla:latest
    container_name: parla
    ports:
      - "8000:8000"
    env_file: backend/.env        # API keys: nunca entran en la imagen
    volumes:
      - tts-cache:/app/backend/.cache   # audios ya pagados: sobreviven a recrear el contenedor
    restart: unless-stopped

volumes:
  tts-cache:
