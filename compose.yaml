services:
  app:
    build: .
    image: parla-rag:latest
    container_name: parla-rag
    ports:
      - "8000:8000"
    env_file: backend/.env        # API keys: nunca entran en la imagen
    volumes:
      - parla-rag-data:/app/backend/data   # la carpeta-DB (corridas, bibliotecas e índices): sobrevive a recrear el contenedor
    restart: unless-stopped

volumes:
  parla-rag-data:
