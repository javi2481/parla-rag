services:
  app:
    build: .
    image: parla:latest
    container_name: parla
    ports:
      - "8000:8000"
    env_file: backend/.env        # API keys: nunca entran en la imagen
    volumes:
      - parla-data:/app/backend/data   # la carpeta-DB (incluye los audios ya pagados): sobrevive a recrear el contenedor
    restart: unless-stopped

volumes:
  parla-data:
